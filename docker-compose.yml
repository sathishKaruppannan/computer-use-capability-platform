services:
  demo-app:
    build: .
    command: uvicorn demo_app.app:app --host 0.0.0.0 --port 8001
    ports: ["8001:8001"]
  platform:
    build: .
    command: uvicorn capability_platform.api.app:app --host 0.0.0.0 --port 8000
    environment:
      TARGET_URL: http://demo-app:8001
      HEADLESS: "true"
    env_file: [.env]
    ports: ["8000:8000"]
    depends_on: [demo-app]

