[project]
name = "computer-use-capability-platform"
version = "0.1.0"
description = "Claude-assisted discovery compiled into deterministic UI capabilities"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.49.0",
  "fastapi>=0.115.0",
  "mcp>=2.0.0",
  "openai>=1.99.0",
  "playwright>=1.51.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "python-multipart>=0.0.20",
  "structlog>=25.1.0",
  "uvicorn>=0.34.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.28.0", "pytest>=8.3.0", "pytest-asyncio>=0.25.0", "ruff>=0.9.0"]

[project.scripts]
capability-platform = "capability_platform.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/capability_platform"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "."]
markers = ["e2e: requires the live demo app and Playwright browser"]

[tool.ruff]
line-length = 100
target-version = "py311"
